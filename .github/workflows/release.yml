name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Accumulates conventional commits into a release PR that bumps the version
  # and updates CHANGELOG.md. Merging that PR is what creates the tag and the
  # GitHub Release, which is what `publish` below keys off.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag, the release and the release PR's branch
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Deliberately a job in this workflow rather than a separate one triggered by
  # the tag: a tag pushed by GITHUB_TOKEN does not start another workflow, so a
  # `on: push: tags` publish would never fire.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Must match the environment configured on the npm package's Trusted Publisher page.
    environment: release
    permissions:
      contents: read
      id-token: write # mints the OIDC token npm exchanges for short-lived publish rights
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # setup-node ships npm 10.x; trusted publishing needs >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      # No NODE_AUTH_TOKEN: auth comes from the OIDC exchange, and
      # provenance is attached automatically when publishing this way.
      - run: npm publish
