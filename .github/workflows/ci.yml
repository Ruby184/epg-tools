name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Formatting, lint, commit messages and the bundle are the same on every Node
  # version, so they run once rather than three times in the matrix below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs the history the PR adds, not just its tip.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Whatever LTS is current, which is what a maintainer runs and what
          # this job is for: formatting, lint and the bundle are the same on
          # every version, so the one to check them on is the one in hand. What
          # the package actually promises is the matrix below, which is pinned.
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # tsdown needs Node >= 22.18, a little above this package's own floor, so
      # the bundle is built here rather than on each leg of the matrix. The
      # output targets Node 22 either way.
      - run: npm run build
      # The hooks are bypassable with --no-verify, so the messages are checked
      # here too. On a PR that is every commit it contributes; on a push to
      # main, the one that arrived.
      - name: Lint commit messages
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            npx commitlint --from "${{ github.event.pull_request.base.sha }}" \
                           --to "${{ github.event.pull_request.head.sha }}" --verbose
          else
            npx commitlint --last --verbose
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is this package's own floor, and what `ky` and `p-queue` declare.
        # 24 was the active LTS until October 2026 and 26 takes over from it,
        # so the three legs are the floor, the version most people are on, and
        # the one they are moving to.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The DTD and XSD conformance suites skip silently without xmllint, so CI
      # installs it — a green run here means they actually ran.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
